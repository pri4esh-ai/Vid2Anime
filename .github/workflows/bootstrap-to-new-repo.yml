name: Bootstrap to New Repo

on:
  workflow_dispatch: # Allows you to run this manually

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Fetch specific commit and setup
        run: |
          # 1. Create a fresh folder and initialize Git
          mkdir clean-build && cd clean-build
          git init

          # 2. Fetch ONLY that specific commit from your old repo
          git remote add old-repo https://github.com/pri4esh-ai/GPT-Video2Anime-Hayao.git
          git fetch old-repo 457729011f42cfc64e7948e5e979ca0b896ee947
          git checkout FETCH_HEAD

          # 3. Sever all ties with the old repo (deletes old history)
          rm -rf .git

          # 4. Start completely fresh as a brand new repository
          git init
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Initial commit: Last working build base (pre-realesrgan removal)"
          git branch -M main

          # 5. Link to your NEW repository and push
          # ⚠️ This uses the secret you created in GitHub Settings
          git remote add origin "${{ secrets.NEW_REPO_URL }}"
          git push -u origin main
          
      - name: ✅ Complete
        run: echo "✅ Done! Your clean build is now the 'main' branch of your new repo."
