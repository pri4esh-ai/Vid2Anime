# 1. Setup and fetch the exact commit
mkdir clean-code && cd clean-code
git init
git remote add old-repo https://github.com/pri4esh-ai/GPT-Video2Anime-Hayao.git
git fetch old-repo 457729011f42cfc64e7948e5e979ca0b896ee947
git checkout FETCH_HEAD

# 2. Delete old Git history AND old GitHub workflows
rm -rf .git
rm -rf .github 

# 3. Initialize fresh repo with ONLY the source code
git init
git add .
git commit -m "Initial commit: Clean source code"
git branch -M main

# 4. Push to your new empty repo
git remote add origin https://github.com/pri4esh-ai/Vid2Anime.git
git push -u origin main
