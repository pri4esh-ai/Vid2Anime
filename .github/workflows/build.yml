name: Build GPT Video2Anime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: video2anime-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare bundled ONNX models
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/models"
          mkdir -p "$MODEL_DIR"

          download_if_missing () {
            NAME="$1"
            URL="$2"
            SHA="$3"

            TARGET="$MODEL_DIR/$NAME"

            if [ -f "$TARGET" ]; then
              echo "$NAME already exists."
              return
            fi

            echo "Downloading $NAME..."

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --output "$TARGET" \
              "$URL"

            ACTUAL="$(sha256sum "$TARGET" | awk '{print $1}')"

            if [ "$ACTUAL" != "$SHA" ]; then
              echo "SHA mismatch for $NAME"
              exit 1
            fi

            echo "$NAME verified."
          }

          download_if_missing \
            "AnimeGANv3_Hayao_36.onnx" \
            "https://github.com/TachibanaYoshino/AnimeGANv3/releases/download/v1.1.0/AnimeGANv3_Hayao_36.onnx" \
            "95ba7b219073fd5b12f569bc38056ffd3019cf4caf15b1feb9f73d1286c9f69d"

          download_if_missing \
            "RealESR-AnimeVideo-v3_x4.onnx" \
            "https://huggingface.co/tidus2102/Real-ESRGAN/resolve/main/RealESR-AnimeVideo-v3_x4.onnx" \
            "00ece3ac21c43ee31459216b5174b2cea0c5325044c5142aeb840f4890e175ff"

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/gptvideo2anime/MainActivity.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessor.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessingService.kt
          test -f app/src/main/java/com/gptvideo2anime/inference/OnnxAnimeEngine.kt

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Validate MediaCodec implementation
        shell: bash
        run: |
          grep -q '!info.isEncoder' app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt
          grep -q 'info.isEncoder' app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          if grep -RIn --exclude-dir=.git 'isDecoder' app/src/main/java; then
            echo "Invalid isDecoder symbol found."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Video2Anime-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Summary
        shell: bash
        run: |
          echo "Build successful."
          ls -lh app/build/outputs/apk/debug/app-debug.apk
